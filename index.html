<!DOCTYPE html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>ElevateLabs Creatives | Esports Media Production</title>
    <meta name="description" content="ElevateLabs Creatives is an esports media production agency: team branding, stream packages, tournament graphics, highlight videos and digital art." />
    <meta name="theme-color" content="#07070b" />
    <meta property="og:title" content="ElevateLabs Creatives | Esports Media Production" />
    <meta property="og:description" content="Team branding, stream packages, tournament graphics, highlights and art. Contract packages or custom." />
    <meta property="og:type" content="website" />
    <!-- Apply saved theme before first paint (no flash) -->
    <script>
      try {
        var t = localStorage.getItem("el-theme");
        if (t === "light" || t === "dark") document.documentElement.setAttribute("data-theme", t);
      } catch (e) {}
    </script>
    <noscript><style>#loader { display: none !important; }</style></noscript>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <!-- Preloader -->
    <div id="loader" aria-hidden="true">
      <div class="loader-logo" id="loader-logo"></div>
      <div class="loader-count"><span id="loader-num">0</span>%</div>
      <div class="loader-bar"><i id="loader-bar"></i></div>
    </div>

    <!-- Custom cursor (only activated on mouse devices) -->
    <div id="cursor-dot"></div>
    <div id="cursor-ring"><i></i><b></b></div>

    <!-- Three.js scene + scroll progress -->
    <canvas id="gl" aria-hidden="true"></canvas>
    <div id="progress" aria-hidden="true"></div>

    <!-- ===== Header ===== -->
    <header class="header" id="header">
      <a class="logo" href="#top" id="logo"></a>
      <nav class="nav" id="nav" aria-label="Main"></nav>
      <div class="header-actions">
        <button class="theme-toggle" id="theme-toggle" type="button"></button>
        <a class="btn btn-sm" id="header-cta" href="#contact"></a>
        <button class="menu-btn" id="menu-btn" aria-label="Open main menu" aria-expanded="false">
          <span></span><span></span>
        </button>
      </div>
    </header>

    <main id="top">
      <!-- ===== Hero ===== -->
      <section class="hero wrap" id="hero">
        <div class="hero-inner">
          <span class="pill" id="hero-badge"></span>
          <h1 id="hero-title">
            <span class="hl" data-split id="hero-l1"></span>
            <span class="hl grad" data-split id="hero-l2"></span>
          </h1>
          <p class="hero-text" id="hero-text"></p>
          <div class="btn-row" id="hero-buttons"></div>
          <p class="hero-meta" id="hero-meta"></p>
        </div>
        <div class="scroll-hint" aria-hidden="true"><span></span>Scroll</div>
      </section>

      <!-- ===== Ticker ===== -->
      <div class="ticker" aria-hidden="true"><div class="ticker-track" id="ticker"></div></div>

      <!-- ===== 01 Services ===== -->
      <section class="section wrap" id="services">
        <div class="section-head">
          <p class="label" id="cap-label"></p>
          <h2 id="cap-title" data-split></h2>
          <p class="lead" id="cap-lead"></p>
        </div>
        <div class="rows" id="cap-rows"></div>
      </section>

      <!-- ===== 02 Packages ===== -->
      <section class="section wrap" id="packages">
        <div class="section-head">
          <p class="label" id="pkg-label"></p>
          <h2 id="pkg-title" data-split></h2>
          <p class="lead" id="pkg-lead"></p>
        </div>
        <div class="pkg-grid" id="pkg-grid"></div>
        <div class="pkg-custom cut reveal-item" id="pkg-custom"></div>
        <p class="note" id="pkg-note"></p>
      </section>

      <!-- ===== 03 Work (horizontal scroll) ===== -->
      <section class="hwrap" id="work">
        <div class="wrap section-head">
          <p class="label" id="work-label"></p>
          <h2 id="work-title" data-split></h2>
        </div>
        <div class="hscroll"><div class="htrack" id="work-track"></div></div>
        <div class="hprog wrap" aria-hidden="true"><i id="hprog-bar"></i></div>
      </section>

      <!-- ===== 04 Process ===== -->
      <section class="section wrap" id="process">
        <div class="section-head">
          <p class="label" id="process-label"></p>
          <h2 id="process-title" data-split></h2>
        </div>
        <ol class="steps" id="process-steps"></ol>
      </section>

      <!-- ===== Contact ===== -->
      <section class="section wrap cta" id="contact">
        <span class="pill" id="cta-pill"></span>
        <h2 id="cta-title" data-split></h2>
        <p class="lead" id="cta-text"></p>
        <form id="contact-form" novalidate>
          <label>Name <input name="name" type="text" required maxlength="80" autocomplete="name" /></label>
          <label>Email <input name="email" type="email" required maxlength="120" autocomplete="email" /></label>
          <label>I'm interested in <select name="package" id="package"></select></label>
          <label>Project details <textarea name="message" rows="4" required maxlength="2000"></textarea></label>
          <button class="btn" type="submit" id="form-submit"></button>
          <p class="form-status" id="form-status" role="status"></p>
        </form>
      </section>
    </main>

    <footer class="footer">
      <div class="wrap footer-grid" id="footer"></div>
    </footer>

    <!-- Libraries (pinned versions) -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/ScrollTrigger.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@studio-freight/lenis@1.0.42/dist/lenis.min.js"></script>

    <!-- Order matters: config → main (builds DOM) → scene (3D) → motion (animates DOM) -->
    <script src="js/config.js"></script>
    <script src="js/main.js"></script>
    <script src="js/scene.js"></script>
    <script src="js/motion.js"></script>
  </body>
</html>
